name: 이지웰 데이터 갱신

on:
  schedule:
    # 매일 09:00 KST (UTC 00:00)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 이지웰 API 조회
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          ./scripts/fetch_ezwel.ps1 -OutPath out/ezwel_rooms.json

      - name: data 브랜치에 저장
        shell: bash
        run: |
          set -e
          cp out/ezwel_rooms.json "$RUNNER_TEMP/ezwel_rooms.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf -q . || true
          fi
          cp "$RUNNER_TEMP/ezwel_rooms.json" ezwel_rooms.json
          git add ezwel_rooms.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -u origin data
          fi