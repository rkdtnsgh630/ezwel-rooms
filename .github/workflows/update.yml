name: 이지웰 데이터 갱신

on:
  schedule:
    # 매일 09:00 KST (UTC 00:00)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 이지웰 API 조회
        shell: pwsh
        run: ./scripts/fetch_ezwel.ps1 -OutPath data/ezwel_rooms.json

      - name: 변경된 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ezwel_rooms.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
